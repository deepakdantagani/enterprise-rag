[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise knowledge-base RAG on EnterpriseRAG-Bench"
requires-python = ">=3.11"
dependencies = [
  "fastembed==0.8.1",
  "gradio>=6.29.0",
  "llama-index-core==0.14.24",
  "llama-index-embeddings-voyageai==0.7.0",
  "llama-index-llms-anthropic>=0.12.2",
  "llama-index-llms-deepseek>=0.4.1",
  "llama-index-llms-ollama>=0.11.0",
  "llama-index-postprocessor-voyageai-rerank>=0.6.0",
  "llama-index-vector-stores-qdrant==0.10.3",
  "markdown-it-py==4.2.0",
  "openinference-instrumentation-llama-index==4.5.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "pyarrow==25.0.1",
  "python-dotenv>=1,<2",
  "tzdata>=2024.1",
  "voyageai==0.5.0 ; python_full_version >= '3.13'",
]

[tool.uv]
cache-dir = ".cache/uv"

[tool.setuptools]
packages = ["pipeline"]
